name: sayso-indexer
services:
  indexer:
    build:
      context: ../indexer
    restart: unless-stopped
    mem_limit: 192m
    depends_on:
      postgres:
        condition: service_healthy
      hasura:
        condition: service_healthy
    environment:
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:-}
      ENVIO_RPC_URL: ${ENVIO_RPC_URL:-}
      ENVIO_PG_HOST: postgres
      ENVIO_PG_PORT: "5432"
      ENVIO_PG_USER: ${ENVIO_PG_USER:-sayso}
      ENVIO_PG_DATABASE: ${ENVIO_PG_DATABASE:-sayso}
      ENVIO_PG_PASSWORD: ${ENVIO_PG_PASSWORD:?Provision private indexer.env}
      ENVIO_PG_SCHEMA: public
      ENVIO_PG_SSL_MODE: "false"
      HASURA_GRAPHQL_ENDPOINT: http://hasura:8080/v1/metadata
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Provision private indexer.env}
      HASURA_GRAPHQL_ROLE: admin
      ENVIO_INDEXER_HOST: "0.0.0.0"
      ENVIO_INDEXER_PORT: "9899"
      NODE_OPTIONS: --max-old-space-size=128
    ports:
      - "127.0.0.1:9899:9899"
    security_opt:
      - no-new-privileges:true
  postgres:
    image: postgres:18.3
    restart: unless-stopped
    mem_limit: 128m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - indexer-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${ENVIO_PG_USER:-sayso}
      POSTGRES_DB: ${ENVIO_PG_DATABASE:-sayso}
      POSTGRES_PASSWORD: ${ENVIO_PG_PASSWORD:?Provision /etc/sayso/indexer.env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
  hasura:
    image: hasura/graphql-engine:v2.43.0
    user: "1001:1001"
    restart: unless-stopped
    mem_limit: 320m
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${ENVIO_PG_USER:-sayso}:${ENVIO_PG_PASSWORD:?Provision /etc/sayso/indexer.env}@postgres:5432/${ENVIO_PG_DATABASE:-sayso}
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:?Provision /etc/sayso/indexer.env}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: public
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup,http-log
      HASURA_GRAPHQL_CORS_DOMAIN: ${SAYSO_WEB_ORIGINS:?Set the allowed SAYSO web origins}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
volumes:
  indexer-data:
