[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["dependencies"]
solc_version = "0.8.37"
# Monad executes the Prague fork (docs.monad.xyz, Hardhat guide: evm version prague).
evm_version = "prague"
# Monad gas model, opcode pricing and 128 KB code limit for tests and gas reports (Foundry >= 1.8).
network = "monad"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
  "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.7.0/",
  "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.7.0/",
  "forge-std/=dependencies/forge-std-1.17.0/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

[soldeer]
remappings_generate = false
remappings_regenerate = false

[dependencies]
"@openzeppelin-contracts" = "5.7.0"
"@openzeppelin-contracts-upgradeable" = "5.7.0"
forge-std = "1.17.0"
