# Generated into config.yaml by scripts/prepare.ts; edit this template, not its output.
name: sayso
handlers: ./src
address_format: lowercase
field_selection:
  transaction_fields:
    - hash
contracts:
  - name: SaysoMarkets
    abi_file_path: ./abi/SaysoMarkets.json
    events:
      - event: EpisodeCreated
      - event: WordAdded
      - event: WordListed
      - event: SetMinted
      - event: SetBurned
      - event: Traded
      - event: WordFlagged
      - event: EvidenceReady
      - event: EpisodeClosed
      - event: WordResolved
      - event: EpisodeSettled
      - event: Redeemed
      - event: WordVoided
      - event: OperatorUpdated
      - event: EpisodesPausedUpdated
      - event: ReportOriginUpdated
  - name: OutcomeToken
    abi_file_path: ./abi/OutcomeToken.json
    events:
      - event: Transfer
chains:
  - id: __CHAIN_ID__
    # [V] docs.envio.dev/docs/HyperSync/hypersync-supported-networks
    # Envio Cloud supplies HyperSync access; local/VPS selects its source in runtime.ts.
    hypersync_config:
      url: https://monad-testnet.hypersync.xyz
    # SaysoMarkets creation block (2026-10-08). Never start after creation.
    start_block: __START_BLOCK__
    contracts:
      - name: SaysoMarkets
        # cast-code verified, SMART-CONTRACTS section 9; generated from core addresses.
        address:
          - "__MARKETS_ADDRESS__"
      - name: OutcomeToken
